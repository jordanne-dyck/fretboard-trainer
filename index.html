<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fretboard Trainer</title>
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fretboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Screens are shown and hidden; there is deliberately no routing (iOS re-prompts mic permission on hash changes). -->

  <section id="start" class="screen">
    <h1>Fretboard Trainer</h1>
    <p class="lead">Set it up once. It runs to the end without asking anything.</p>
    <div id="setup" class="setup"></div>
    <div class="frets" data-show="ladder mixed">
      <div class="row-label">Frets</div>
      <div class="frets-row">
        <div class="stepper">
          <span class="stepper-label">From</span>
          <button data-step="min" data-delta="-1" aria-label="Lower start fret">−</button>
          <output id="fret-min">0</output>
          <button data-step="min" data-delta="1" aria-label="Raise start fret">+</button>
        </div>
        <div class="stepper">
          <span class="stepper-label">To</span>
          <button data-step="max" data-delta="-1" aria-label="Lower end fret">−</button>
          <output id="fret-max">20</output>
          <button data-step="max" data-delta="1" aria-label="Raise end fret">+</button>
        </div>
      </div>
      <p class="hint" id="fret-hint"></p>
    </div>
    <p class="hint" id="wake-hint" hidden>This browser can't keep the screen on. Raise auto-lock in phone settings before practising.</p>
    <div class="start-bar">
      <div id="summary" class="summary"></div>
      <button id="go" class="go">Start</button>
    </div>
  </section>

  <section id="card" class="screen" hidden>
    <div class="card-label">Next up</div>
    <div class="card-title" id="card-title"></div>
    <div class="card-sub" id="card-sub"></div>
    <div class="card-count" id="card-count"></div>
  </section>

  <section id="drill" class="screen" hidden>
    <header class="bar">
      <span id="block-name"></span>
      <span id="block-time" class="time"></span>
      <button id="end" class="end">End</button>
    </header>
    <div class="progress"><div id="progress-fill"></div></div>
    <main class="prompt">
      <div id="flag" class="flag" hidden>Pattern unconfirmed — check the sequence is right</div>
      <div id="p-main" class="p-main"></div>
      <div id="p-sub" class="p-sub"></div>
      <div id="p-pattern" class="p-pattern"></div>
      <div id="p-say" class="p-say"></div>
      <div id="p-answer" class="p-answer" hidden></div>
    </main>
    <footer class="actions">
      <button id="reveal" class="reveal">Show answer</button>
      <div id="marks" class="marks" hidden>
        <button data-mark="got">Got it</button>
        <button data-mark="slow">Slow</button>
        <button data-mark="missed">Missed</button>
      </div>
    </footer>
  </section>

  <section id="done" class="screen" hidden>
    <h1>Session complete</h1>
    <p class="lead" id="done-summary"></p>
    <div class="tally" id="done-tally"></div>
    <button id="again" class="length wide">Back to start</button>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
